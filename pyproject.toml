[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turkce-vurgu"
version = "0.1.1"
description = "Türkçe G2P ve sözcük vurgusu: metin → vurgu işaretli IPA (espeak'siz, ses sentezi için)"
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/seslen-tr/turkce-vurgu"
Source = "https://github.com/seslen-tr/turkce-vurgu"
Issues = "https://github.com/seslen-tr/turkce-vurgu/issues"

[project.optional-dependencies]
tam = ["turkce-normalize>=0.1"]

[tool.setuptools.packages.find]
include = ["turkce_vurgu*"]

[tool.setuptools.package-data]
turkce_vurgu = ["veri/*.tsv", "veri/*.txt"]
